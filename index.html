<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦞 电商价格监控 - 功能演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        .header .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .demo-area {
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }
        
        .card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #495057;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.3s, box-shadow 0.3s;
            width: 100%;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .result-area {
            background: #1a1a2e;
            color: white;
            border-radius: 15px;
            padding: 25px;
            font-family: 'Courier New', monospace;
            min-height: 300px;
            overflow-y: auto;
        }
        
        .result-area .success {
            color: #28a745;
        }
        
        .result-area .error {
            color: #dc3545;
        }
        
        .result-area .info {
            color: #17a2b8;
        }
        
        .result-area .price {
            color: #ffc107;
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .platform-badges {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .platform-badge {
            padding: 8px 15px;
            background: #e9ecef;
            border-radius: 20px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .platform-badge.active {
            background: #667eea;
            color: white;
        }
        
        .platform-badge:hover {
            transform: translateY(-2px);
        }
        
        .monitoring-list {
            margin-top: 20px;
        }
        
        .monitoring-item {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 5px solid #667eea;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        
        .monitoring-item .name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .monitoring-item .price {
            color: #28a745;
            font-size: 1.2em;
        }
        
        .monitoring-item .status {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            margin-top: 5px;
        }
        
        .monitoring-item .status.online {
            background: #d4edda;
            color: #155724;
        }
        
        .monitoring-item .status.offline {
            background: #f8d7da;
            color: #721c24;
        }
        
        @media (max-width: 768px) {
            .demo-area {
                grid-template-columns: 1fr;
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🦞 电商价格监控 - 实时功能演示</h1>
            <div class="subtitle">在这里直接测试价格监控功能，无需安装！</div>
        </div>
        
        <div class="demo-area">
            <div class="card">
                <h2>🎯 添加监控商品</h2>
                
                <div class="platform-badges">
                    <div class="platform-badge active" data-platform="taobao">淘宝</div>
                    <div class="platform-badge" data-platform="jd">京东</div>
                    <div class="platform-badge" data-platform="pdd">拼多多</div>
                </div>
                
                <div class="form-group">
                    <label for="productUrl">商品链接</label>
                    <input type="text" id="productUrl" placeholder="例如: https://item.taobao.com/item.htm?id=123456789">
                </div>
                
                <div class="form-group">
                    <label for="productName">商品名称</label>
                    <input type="text" id="productName" placeholder="例如: iPhone 15 Pro Max">
                </div>
                
                <div class="form-group">
                    <label for="targetPrice">目标价格（元）</label>
                    <input type="number" id="targetPrice" placeholder="例如: 5000" value="5000">
                </div>
                
                <button class="btn" id="addProductBtn">🦞 添加监控</button>
                
                <div class="monitoring-list" id="monitoringList">
                    <h3>📊 当前监控中的商品</h3>
                    <!-- 动态添加监控项目 -->
                </div>
            </div>
            
            <div class="card">
                <h2>📈 价格监控控制台</h2>
                
                <div style="margin-bottom: 20px;">
                    <button class="btn" id="startMonitoringBtn" style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%); margin-bottom: 10px;">
                        ▶️ 启动监控服务
                    </button>
                    <button class="btn" id="stopMonitoringBtn" style="background: linear-gradient(135deg, #dc3545 0%, #e83e8c 100%);">
                        ⏹️ 停止监控服务
                    </button>
                </div>
                
                <div class="form-group">
                    <label for="checkInterval">检查间隔（分钟）</label>
                    <select id="checkInterval">
                        <option value="5">5分钟</option>
                        <option value="15">15分钟</option>
                        <option value="30" selected>30分钟</option>
                        <option value="60">1小时</option>
                    </select>
                </div>
                
                <button class="btn" id="checkNowBtn" style="background: linear-gradient(135deg, #ffc107 0%, #fd7e14 100%);">
                    🔍 立即检查所有商品
                </button>
                
                <div class="result-area" id="consoleOutput">
                    <div class="info">🦞 电商价格监控控制台已就绪</div>
                    <div class="info">等待指令...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 模拟数据存储
        let monitoringProducts = JSON.parse(localStorage.getItem('monitoringProducts') || '[]');
        let isMonitoring = false;
        let monitoringInterval = null;
        
        // 平台选择
        document.querySelectorAll('.platform-badge').forEach(badge => {
            badge.addEventListener('click', function() {
                document.querySelectorAll('.platform-badge').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                const platform = this.dataset.platform;
                const urlInput = document.getElementById('productUrl');
                
                // 根据平台设置示例URL
                const examples = {
                    'taobao': 'https://item.taobao.com/item.htm?id=123456789',
                    'jd': 'https://item.jd.com/10012345678.html',
                    'pdd': 'https://yangkeduo.com/goods.html?goods_id=123456789'
                };
                
                urlInput.placeholder = `例如: ${examples[platform]}`;
            });
        });
        
        // 添加商品监控（使用真实API）
        document.getElementById('addProductBtn').addEventListener('click', async function() {
            const url = document.getElementById('productUrl').value.trim();
            const name = document.getElementById('productName').value.trim() || '待获取...';
            const targetPrice = parseFloat(document.getElementById('targetPrice').value) || 0;
            const platform = document.querySelector('.platform-badge.active').dataset.platform;
            
            if (!url) {
                addConsoleOutput('❌ 请输入商品链接', 'error');
                return;
            }
            
            // 禁用按钮，防止重复点击
            const btn = this;
            btn.disabled = true;
            btn.innerHTML = '🦞 获取价格中...';
            
            try {
                addConsoleOutput(`🔍 正在获取商品价格...`, 'info');
                
                // 调用真实API获取价格
                const response = await fetch('/api/check-price', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const productName = data.title || name;
                    const currentPrice = data.price;
                    const isMock = data.isMock || false;
                    
                    const product = {
                        id: Date.now(),
                        url,
                        name: productName,
                        platform: data.platform || platform,
                        targetPrice,
                        currentPrice: currentPrice.toFixed(2),
                        lowestPrice: currentPrice.toFixed(2), // 初始最低价就是当前价
                        highestPrice: currentPrice.toFixed(2), // 初始最高价就是当前价
                        lastChecked: new Date().toLocaleTimeString(),
                        isActive: true,
                        isMock: isMock
                    };
                    
                    monitoringProducts.push(product);
                    saveToLocalStorage();
                    updateMonitoringList();
                    
                    // 清空表单
                    document.getElementById('productUrl').value = '';
                    document.getElementById('productName').value = '';
                    
                    addConsoleOutput(`✅ 已添加监控: ${productName} (目标价: ¥${targetPrice})`, 'success');
                    addConsoleOutput(`📱 当前价格: ¥${currentPrice.toFixed(2)} ${isMock ? '(模拟数据)' : '(真实数据)'}`, 'info');
                    
                    if (isMock) {
                        addConsoleOutput('💡 提示: 这是模拟数据，真实抓取可能被反爬虫限制', 'info');
                    }
                } else {
                    addConsoleOutput(`❌ 获取价格失败: ${data.message || '未知错误'}`, 'error');
                }
                
            } catch (error) {
                console.error('API调用错误:', error);
                addConsoleOutput(`❌ 网络错误: ${error.message}`, 'error');
                
                // 出错时使用模拟数据
                const mockPrice = targetPrice > 0 ? targetPrice * 0.8 : Math.random() * 500 + 50;
                const product = {
                    id: Date.now(),
                    url,
                    name: name === '待获取...' ? '模拟商品' : name,
                    platform,
                    targetPrice,
                    currentPrice: mockPrice.toFixed(2),
                    lowestPrice: mockPrice.toFixed(2),
                    highestPrice: mockPrice.toFixed(2),
                    lastChecked: new Date().toLocaleTimeString(),
                    isActive: true,
                    isMock: true
                };
                
                monitoringProducts.push(product);
                saveToLocalStorage();
                updateMonitoringList();
                
                document.getElementById('productUrl').value = '';
                document.getElementById('productName').value = '';
                
                addConsoleOutput(`✅ 已添加监控（模拟数据）: ${product.name}`, 'success');
                addConsoleOutput(`📱 当前价格: ¥${mockPrice.toFixed(2)} (模拟)`, 'info');
            } finally {
                // 恢复按钮
                btn.disabled = false;
                btn.innerHTML = '🦞 添加监控';
            }
        });
        
        // 启动监控服务
        document.getElementById('startMonitoringBtn').addEventListener('click', function() {
            if (monitoringProducts.length === 0) {
                addConsoleOutput('❌ 请先添加要监控的商品', 'error');
                return;
            }
            
            if (isMonitoring) {
                addConsoleOutput('⚠️ 监控服务已经在运行中', 'info');
                return;
            }
            
            isMonitoring = true;
            const interval = parseInt(document.getElementById('checkInterval').value) * 60000;
            
            addConsoleOutput('🦞 启动价格监控服务...', 'success');
            addConsoleOutput(`⏰ 检查间隔: ${document.getElementById('checkInterval').value}分钟`, 'info');
            addConsoleOutput(`📊 监控商品数: ${monitoringProducts.length}个`, 'info');
            
            // 模拟定时检查
            monitoringInterval = setInterval(() => {
                checkAllProducts();
            }, 5000); // 实际演示用5秒间隔
            
            updateButtonStates();
        });
        
        // 停止监控服务
        document.getElementById('stopMonitoringBtn').addEventListener('click', function() {
            if (!isMonitoring) {
                addConsoleOutput('⚠️ 监控服务未在运行', 'info');
                return;
            }
            
            clearInterval(monitoringInterval);
            isMonitoring = false;
            
            addConsoleOutput('⏹️ 监控服务已停止', 'info');
            updateButtonStates();
        });
        
        // 立即检查所有商品
        document.getElementById('checkNowBtn').addEventListener('click', function() {
            if (monitoringProducts.length === 0) {
                addConsoleOutput('❌ 没有可监控的商品', 'error');
                return;
            }
            
            addConsoleOutput('🔍 开始检查所有商品价格...', 'info');
            checkAllProducts();
        });
        
        // 检查所有商品价格（使用真实API）
        async function checkAllProducts() {
            if (monitoringProducts.length === 0) return;
            
            addConsoleOutput(`🔍 开始检查 ${monitoringProducts.length} 个商品...`, 'info');
            
            for (let i = 0; i < monitoringProducts.length; i++) {
                const product = monitoringProducts[i];
                
                try {
                    // 调用API获取最新价格
                    const response = await fetch('/api/check-price', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ url: product.url })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        const oldPrice = parseFloat(product.currentPrice);
                        const newPrice = data.price;
                        const isMock = data.isMock || false;
                        
                        // 更新商品信息
                        product.currentPrice = newPrice.toFixed(2);
                        product.lastChecked = new Date().toLocaleTimeString();
                        product.isMock = isMock;
                        
                        // 更新商品名称（如果API返回了更好的名称）
                        if (data.title && data.title !== '未知商品' && data.title !== '模拟商品') {
                            product.name = data.title;
                        }
                        
                        // 更新最低/最高价
                        if (newPrice < parseFloat(product.lowestPrice)) {
                            product.lowestPrice = newPrice.toFixed(2);
                        }
                        if (newPrice > parseFloat(product.highestPrice)) {
                            product.highestPrice = newPrice.toFixed(2);
                        }
                        
                        // 检查是否达到目标价
                        if (product.targetPrice > 0 && newPrice <= product.targetPrice) {
                            addConsoleOutput(`🎉 降价提醒！${product.name} 当前价格: ¥${newPrice.toFixed(2)} (目标: ¥${product.targetPrice})`, 'success');
                            showNotification(product.name, newPrice, product.targetPrice);
                        }
                        
                        // 显示价格变化
                        const change = ((newPrice - oldPrice) / oldPrice * 100).toFixed(2);
                        const changeSymbol = change >= 0 ? '📈' : '📉';
                        addConsoleOutput(`${changeSymbol} ${product.name}: ¥${oldPrice.toFixed(2)} → ¥${newPrice.toFixed(2)} (${change}%) ${isMock ? '(模拟)' : ''}`, 'info');
                        
                        // 更新显示
                        updateProductInList(i);
                        
                    } else {
                        addConsoleOutput(`❌ ${product.name}: 获取价格失败`, 'error');
                    }
                    
                } catch (error) {
                    addConsoleOutput(`❌ ${product.name}: 网络错误 - ${error.message}`, 'error');
                    
                    // 出错时使用模拟波动
                    const change = (Math.random() * 0.1 - 0.05);
                    const oldPrice = parseFloat(product.currentPrice);
                    const newPrice = oldPrice * (1 + change);
                    
                    product.currentPrice = newPrice.toFixed(2);
                    product.lastChecked = new Date().toLocaleTimeString();
                    product.isMock = true;
                    
                    // 检查是否达到目标价
                    if (product.targetPrice > 0 && newPrice <= product.targetPrice) {
                        addConsoleOutput(`🎉 降价提醒（模拟）！${product.name} 当前价格: ¥${newPrice.toFixed(2)} (目标: ¥${product.targetPrice})`, 'success');
                        showNotification(product.name, newPrice, product.targetPrice);
                    }
                    
                    updateProductInList(i);
                }
                
                // 避免请求过快（对API友好）
                await new Promise(resolve => setTimeout(resolve, 1000));
            }
            
            saveToLocalStorage();
            addConsoleOutput(`✅ 价格检查完成 (${new Date().toLocaleTimeString()})`, 'info');
        }
        
        // 显示桌面通知
        function showNotification(productName, currentPrice, targetPrice) {
            if (!("Notification" in window)) return;
            
            if (Notification.permission === "granted") {
                new Notification("🎉 价格降价提醒！", {
                    body: `${productName}\n当前价格: ¥${currentPrice.toFixed(2)}\n目标价格: ¥${targetPrice}`,
                    icon: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f980.png"
                });
            } else if (Notification.permission !== "denied") {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        new Notification("🎉 价格降价提醒！", {
                            body: `${productName}\n当前价格: ¥${currentPrice.toFixed(2)}\n目标价格: ¥${targetPrice}`,
                            icon: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f980.png"
                        });
                    }
                });
            }
        }
        
        // 更新监控列表
        function updateMonitoringList() {
            const listContainer = document.getElementById('monitoringList');
            listContainer.innerHTML = '<h3>📊 当前监控中的商品</h3>';
            
            if (monitoringProducts.length === 0) {
                listContainer.innerHTML += '<div style="text-align: center; padding: 20px; color: #6c757d;">暂无监控商品，请添加</div>';
                return;
            }
            
            monitoringProducts.forEach((product, index) => {
                const item = document.createElement('div');
                item.className = 'monitoring-item';
                item.innerHTML = `
                    <div class="name">${product.name}</div>
                    <div class="price">当前价格: ¥${product.currentPrice}</div>
                    <div>目标价格: ¥${product.targetPrice || '未设置'}</div>
                    <div>最低价: ¥${product.lowestPrice} | 最高价: ¥${product.highestPrice}</div>
                    <div>最后检查: ${product.lastChecked}</div>
                    <div class="status ${product.isActive ? 'online' : 'offline'}">
                        ${product.isActive ? '监控中' : '已停止'}
                    </div>
                    <button onclick="removeProduct(${index})" style="margin-top: 10px; padding: 5px 10px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer;">
                        移除
                    </button>
                `;
                listContainer.appendChild(item);
            });
        }
        
        // 更新单个商品显示
        function updateProductInList(index) {
            const product = monitoringProducts[index];
            const items = document.querySelectorAll('.monitoring-item');
            if (items[index]) {
                items[index].querySelector('.price').textContent = `当前价格: ¥${product.currentPrice}`;
                items[index].querySelector('div:nth-child(4)').textContent = `最低价: ¥${product.lowestPrice} | 最高价: ¥${product.highestPrice}`;
                items[index].querySelector('div:nth-child(5)').textContent = `最后检查: ${product.lastChecked}`;
            }
        }
        
        // 移除商品
        function removeProduct(index) {
            const productName = monitoringProducts[index].name;
            monitoringProducts.splice(index, 1);
            saveToLocalStorage();
            updateMonitoringList();
            addConsoleOutput(`🗑️ 已移除监控: ${productName}`, 'info');
        }
        
        // 添加控制台输出
        function addConsoleOutput(message, type = 'info') {
            const consoleOutput = document.getElementById('consoleOutput');
            const line = document.createElement('div');
            line.className = type;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            consoleOutput.appendChild(line);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }
        
        // 保存到本地存储
        function saveToLocalStorage() {
            localStorage.setItem('monitoringProducts', JSON.stringify(monitoringProducts));
        }
        
        // 更新按钮状态
        function updateButtonStates() {
            document.getElementById('startMonitoringBtn').disabled = isMonitoring;
            document.getElementById('stopMonitoringBtn').disabled = !isMonitoring;
        }
        
        // 请求通知权限
        if ("Notification" in window && Notification.permission === "default") {
            setTimeout(() => {
                Notification.requestPermission();
            }, 2000);
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateMonitoringList();
            updateButtonStates();
            
            // 添加示例数据（如果为空）
            if (monitoringProducts.length === 0) {
                addConsoleOutput('🦞 欢迎使用电商价格监控演示！', 'success');
                addConsoleOutput('💡 提示: 添加商品后点击"启动监控服务"', 'info');
                addConsoleOutput('🔔 允许浏览器通知接收降价提醒', 'info');
            } else {
                addConsoleOutput(`🦞 已加载 ${monitoringProducts.length} 个监控商品`, 'success');
            }
            
            // 自动检查一次
            setTimeout(() => {
                if (monitoringProducts.length > 0) {
                    checkAllProducts();
                }
            }, 1000);
        });
        
        // 导出函数到全局
        window.removeProduct = removeProduct;
    </script>
</body>
</html>
